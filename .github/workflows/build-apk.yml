name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Salvar nossos arquivos
        run: |
          mkdir -p backup
          cp -r lib backup/
          cp pubspec.yaml backup/
          cp -r assets backup/ 2>/dev/null || true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'

      - name: Criar projeto do zero
        run: flutter create --org com.rotasbus --project-name rotas_bus --platforms android .

      - name: Restaurar nossos arquivos
        run: |
          cp -r backup/lib/* lib/
          cp backup/pubspec.yaml .
          rm -rf backup

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rotas_Bus_APK
          path: build/app/outputs/flutter-apk/app-release.apk
