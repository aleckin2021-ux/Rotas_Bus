name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'

      - name: Restaurar pasta Android
        run: flutter create --org com.rotasbus --project-name rotas_bus .

      - name: Corrigir compatibilidade do Gradle
        run: |
          cd android
          echo "android { namespace \"com.rotasbus.app\" compileSdk 34 }" > temp.txt
          sed -i 's/compileSdk .*/compileSdk 34/g' app/build.gradle
          sed -i 's/minSdk .*/minSdk 21/g' app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 34/g' app/build.gradle

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rotas_Bus_APK
          path: build/app/outputs/flutter-apk/app-release.apk
